<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GP Scanner</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 40px auto;
    }

    h1 {
      margin-top: 30px;
      font-size: 28px;
    }
  </style>
</head>

<body>
  <h1>Scan QR Code</h1>
  <div id="reader"></div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script>
    const wixScannerUrl = "https://www.granitepointresort.com/scanner-page";

    const scanner = new Html5Qrcode("reader");

    scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      (decodedText) => {
        scanner.stop().then(() => {
          const clean = encodeURIComponent(decodedText);
          window.location.href = wixScannerUrl + "?scan=" + clean;
        });
      },
      () => {}
    );
  </script>
</body>
</html>
